services:
  postgres:
    image: postgres:16
    container_name: scamseeker_postgres
    environment:
      POSTGRES_DB: text_risk_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d text_risk_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: scamseeker_app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data: